<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер Нубини Пицанини</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            color: #ffcc00;
        }
        #username {
            font-size: 18px;
            color: #00ffcc;
            margin-bottom: 20px;
        }
        .score-box {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .energy-box {
            font-size: 16px;
            color: #ff9900;
            margin-bottom: 20px;
        }
        .clicker-btn {
            background: linear-gradient(135deg, #ff9900, #ff3300);
            border: none;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 102, 0, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
        }
        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
        }
        .cases-section {
            margin-top: 30px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 12px;
            width: 80%;
            max-width: 300px;
        }
        .case-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        .case-btn:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>🍕 Кликер Нубини</h1>
    <div id="username">Игрок</div>

    <div class="score-box">💰 Монеты: <span id="score">0</span></div>
    <div class="energy-box">⚡ Энергия: <span id="energy">100</span>/100</div>

    <button class="clicker-btn" id="clickBtn">КЛИК!</button>

    <div class="cases-section">
        <h3>🎁 Кейсы</h3>
        <p>Открыть кейс: 50 монет</p>
        <button class="case-btn" id="openCaseBtn">Открыть кейс</button>
        <p id="caseResult" style="margin-top: 10px; font-size: 14px; color: #ffcc00;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user && user.first_name) {
            document.getElementById('username').innerText = `Привет, ${user.first_name}!`;
        }

        // Загружаем монеты из памяти телефона (сохраняются навсегда)
        let score = parseInt(localStorage.getItem('player_score')) || 0;
        let energy = 100;
        const maxEnergy = 100;

        const scoreElement = document.getElementById('score');
        const energyElement = document.getElementById('energy');
        const clickBtn = document.getElementById('clickBtn');
        const openCaseBtn = document.getElementById('openCaseBtn');
        const caseResult = document.getElementById('caseResult');

        scoreElement.innerText = score;

        function saveScore() {
            localStorage.setItem('player_score', score);
        }

        clickBtn.addEventListener('click', () => {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                scoreElement.innerText = score;
                energyElement.innerText = energy;
                saveScore();
            } else {
                alert('Энергия закончилась! Подожди немного.');
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                energyElement.innerText = energy;
            }
        }, 1000);

        openCaseBtn.addEventListener('click', () => {
            if (score >= 50) {
                score -= 50;
                const reward = Math.floor(Math.random() * 80) + 10;
                score += reward;
                scoreElement.innerText = score;
                caseResult.innerText = `🎉 Вы выиграли +${reward} монет!`;
                saveScore();
            } else {
                caseResult.innerText = '❌ Недостаточно монет (нужно 50)!';
            }
        });
    </script>
</body>
</html>
