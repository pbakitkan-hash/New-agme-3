<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Farm</title>
    <style>
        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding-top: 15px;
            padding-bottom: 80px;
        }
        .tab-content {
            display: none;
            width: 92%;
            max-width: 420px;
            text-align: center;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats {
            font-size: 18px;
            margin-bottom: 12px;
            background: #1a1d29;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #2a2e43;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
        }
        .clicker-target {
            width: 160px;
            height: 160px;
            background: #252a3d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #f39c12;
            user-select: none;
            transition: transform 0.1s;
            margin: 15px 0;
            font-size: 50px;
        }
        .clicker-target:active {
            transform: scale(0.92);
        }
