<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Farm</title>
    <style>
        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding-top: 15px;
            padding-bottom: 80px;
        }
        .tab-content {
            display: none;
            width: 92%;
            max-width: 420px;
            text-align: center;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stats {
            font-size: 18px;
            margin-bottom: 12px;
            background: #1a1d29;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #2a2e43;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
        }
        .clicker-target {
            width: 160px;
            height: 160px;
            background: #252a3d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #f39c12;
            user-select: none;
            transition: transform 0.1s;
            margin: 15px 0;
        }
        .clicker-target:active {
            transform: scale(0.92);
        }
        .clicker-target img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .card {
            background: #1a1d29;
            border: 1px solid #2a2e43;
            padding: 12px;
            border-radius: 12px;
            margin: 6px 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .action-btn {
            background: #f39c12;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:disabled {
            background: #4a4f68;
            cursor: not-allowed;
            color: #8b93b0;
        }
        /* Горизонтальное меню с прокруткой внизу */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #141722;
            border-top: 1px solid #23283d;
            display: flex;
            overflow-x: auto;
            padding: 8px 5px;
            z-index: 100;
            gap: 10px;
            box-sizing: border-box;
        }
        .nav-item {
            background: none;
            border: none;
            color: #8b93b0;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            min-width: 60px;
            gap: 2px;
        }
        .nav-item.active {
            color: #f39c12;
        }
        .nav-item span {
            font-size: 16px;
        }
        h2 { margin: 10px 0; font-size: 20px; }
